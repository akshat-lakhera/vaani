[project]
name = "vaani"
version = "0.1.0"
description = "Voice RAG for HH Goa 2026 — MSMARCO-XI, extractive fast path, real benchmarks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "orjson>=3.10",
  "datasets>=3.0",
  "huggingface_hub>=0.26",
  "sentence-transformers>=3.3",
  "faiss-cpu>=1.8",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
