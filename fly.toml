# Persistent Fly.io app. Requires a volume mounted at /app/data
# containing data/indexes/shipped and data/models/e5-small.
#   fly launch --no-deploy
#   fly volumes create vaani_data --size 10
#   fly deploy

app = "vaani-hhgoa"
primary_region = "sin"

[build]

[env]
  VAANI_DATA_DIR = "/app/data"
  VAANI_HOST = "0.0.0.0"
  VAANI_PORT = "8080"
  TOKENIZERS_PARALLELISM = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/api/health"
